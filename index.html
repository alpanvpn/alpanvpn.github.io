<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ALPAN VPN</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 50% 15%, #ff2250 0%, #ff0137 60%, #c40028 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 52px 24px 36px;
      color: #ffffff;
      overflow-x: hidden;
      position: relative;
    }

    /* Фоновая монограмма логотипов */
    .monogram-bg {
      position: fixed;
      top: -60%;
      left: -60%;
      width: 220%;
      height: 220%;
      background-image: url('logo.png');
      background-repeat: repeat;
      background-size: 110px 110px;
      transform: rotate(45deg);
      opacity: 0.14; /* Плотность монограммы: 14% */
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    /* Шапка: Логотип + Название */
    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 22px;
      width: 100%;
    }

    .logo-img {
      width: 82px;
      height: 82px;
      object-fit: contain;
      filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.35));
    }

    h1 {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }

    .subtitle {
      font-size: 21px;
      font-weight: 700;
      margin-bottom: 36px;
      text-align: center;
      letter-spacing: -0.2px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
    }

    /* Список кнопок */
    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Эффект Liquid Glass */
    .link-card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.92) 0%, rgba(255, 255, 255, 0.72) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-top: 1.5px solid #ffffff;
      border-radius: 26px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      text-decoration: none;
      box-shadow: 
        0 14px 32px rgba(110, 0, 20, 0.4),
        inset 0 1px 2px rgba(255, 255, 255, 0.9),
        inset 0 -1px 3px rgba(0, 0, 0, 0.05);
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
      cursor: pointer;
    }

    .link-card:active {
      transform: scale(0.975);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0.6) 100%);
      box-shadow: 0 6px 16px rgba(110, 0, 20, 0.3);
    }

    /* Подложка под иконку */
    .icon-box {
      width: 52px;
      height: 52px;
      border-radius: 18px;
      background: rgba(255, 1, 55, 0.07);
      border: 1px solid rgba(255, 1, 55, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-right: 18px;
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.8);
    }

    .icon-box svg {
      width: 26px;
      height: 26px;
      stroke: #ff0137;
      fill: none;
      stroke-width: 2.3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .text-box {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      text-align: left;
    }

    .title {
      font-size: 16px;
      font-weight: 800;
      color: #121316;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .meta {
      font-size: 13.5px;
      color: #555966;
      font-weight: 600;
    }

    .arrow svg {
      width: 18px;
      height: 18px;
      stroke: #1f2024;
      fill: none;
      stroke-width: 2.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>

  <!-- Слой монограммы -->
  <div class="monogram-bg"></div>

  <div class="container">
    
    <div class="header">
      <img src="logo.png" alt="ALPAN VPN" class="logo-img">
      <h1>ALPAN VPN</h1>
    </div>

    <div class="subtitle">Лучший впн в Дагестане.</div>

    <div class="links-list">
      <!-- Бот -->
      <a href="https://t.me/AlpanVPNrobot?start=ref_6060506168" class="link-card">
        <div class="icon-box">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="10" width="18" height="11" rx="3"></rect>
            <circle cx="12" cy="4" r="2"></circle>
            <path d="M12 6v4"></path>
            <line x1="8" y1="15" x2="8.01" y2="15"></line>
            <line x1="16" y1="15" x2="16.01" y2="15"></line>
          </svg>
        </div>
        <div class="text-box">
          <span class="title">НАШ БОТ</span>
          <span class="meta">t.me/AlpanVPNrobot</span>
        </div>
        <div class="arrow">
          <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </div>
      </a>

      <!-- Канал -->
      <a href="https://t.me/alpanvpn" class="link-card">
        <div class="icon-box">
          <svg viewBox="0 0 24 24" style="transform: rotate(-10deg);">
            <polygon points="5 3 20 12 5 21 5 3"></polygon>
          </svg>
        </div>
        <div class="text-box">
          <span class="title">НАШ КАНАЛ</span>
          <span class="meta">t.me/alpanvpn</span>
        </div>
        <div class="arrow">
          <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </div>
      </a>

      <!-- Поддержка -->
      <a href="https://t.me/AlpanSupport" class="link-card">
        <div class="icon-box">
          <svg viewBox="0 0 24 24">
            <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
            <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
          </svg>
        </div>
        <div class="text-box">
          <span class="title">ПОДДЕРЖКА</span>
          <span class="meta">t.me/AlpanSupport</span>
        </div>
        <div class="arrow">
          <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </div>
      </a>
    </div>

  </div>

</body>
</html>
