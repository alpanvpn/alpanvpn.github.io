<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALPAN VPN — Лучший впн в Дагестане</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand: #FF073A;
            --brand-glow: rgba(255, 7, 58, 0.45);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #F8F9FD;
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* Направляющие вертикальные линии */
        .grid-lines {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 440px;
            height: 100%;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 1;
            padding: 0 16px;
        }

        .grid-line {
            width: 1px;
            height: 100%;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.03) 0%, rgba(255, 7, 58, 0.12) 100%);
        }

        /* Мягкий нижний розово-красный градиент */
        .bottom-mesh {
            position: fixed;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 140%;
            max-width: 720px;
            height: 65vh;
            background: radial-gradient(ellipse 85% 60% at 50% 100%, rgba(255, 59, 92, 0.38) 0%, rgba(255, 120, 145, 0.18) 55%, transparent 100%);
            pointer-events: none;
            z-index: 1;
            filter: blur(50px);
        }

        /* Основной центровочный контейнер */
        .stage-wrapper {
            width: 100%;
            max-width: 410px;
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Полноразмерный макет смартфона строго по референсу */
        .phone-mockup-frame {
            position: absolute;
            top: -110px;
            left: 50%;
            transform: translateX(-50%);
            width: 380px;
            max-width: 94vw;
            pointer-events: none;
            z-index: 1;
            display: flex;
            justify-content: center;
            opacity: 0.94;
            animation: phoneDropIn 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            will-change: transform, opacity;
        }

        .phone-mockup-frame img {
            width: 100%;
            height: auto;
            display: block;
            filter: drop-shadow(0 25px 45px rgba(255, 7, 58, 0.22)) drop-shadow(0 10px 20px rgba(0, 0, 0, 0.08));
        }

        @keyframes phoneDropIn {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(70px) scale(0.96);
            }
            100% {
                opacity: 0.94;
                transform: translateX(-50%) translateY(0) scale(1);
            }
        }

        /* Контейнер элементов интерфейса поверх телефона */
        .ui-overlay {
            width: 100%;
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 195px; /* Точное позиционирование шапки по центру экрана макета */
        }

        /* Шапка с мощной световой диффузией для 100% читаемости поверх экрана телефона */
        .header {
            text-align: center;
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding: 10px 24px;
        }

        /* Многослойный световой барьер-подложка под заголовком */
        .header::before {
            content: '';
            position: absolute;
            inset: -14px -35px;
            background: radial-gradient(ellipse 65% 55% at 50% 50%, rgba(255, 255, 255, 0.96) 0%, rgba(255, 255, 255, 0.88) 50%, rgba(255, 255, 255, 0) 100%);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            z-index: -1;
            pointer-events: none;
            border-radius: 40px;
        }

        .logo-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 4px;
        }

        /* Apple Squircle иконка по референсу */
        .apple-app-icon {
            width: 44px;
            height: 44px;
            border-radius: 11px;
            background: linear-gradient(145deg, #FF1744 0%, #D50028 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
            border: 1.2px solid rgba(255, 255, 255, 0.5);
            box-shadow: 
                0 12px 24px -3px rgba(229, 9, 48, 0.55),
                0 4px 10px -2px rgba(229, 9, 48, 0.35),
                inset 0 1.5px 2px 0 rgba(255, 255, 255, 0.7),
                inset 0 -1.5px 2px 0 rgba(0, 0, 0, 0.2);
        }

        .brand-logo-img {
            width: 25px;
            height: 25px;
            object-fit: contain;
            display: block;
        }

        /* Заголовок ALPAN VPN с повышенной контрастной тенью */
        .title {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            background: linear-gradient(180deg, #FF1E46 0%, #E6002E 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 14px rgba(255, 255, 255, 0.9)) drop-shadow(0 4px 18px rgba(255, 7, 58, 0.35));
        }

        /* Подзаголовок с глубокой тенью отсечения */
        .subtitle {
            font-size: 15px;
            font-weight: 800;
            color: #11161F;
            letter-spacing: -0.01em;
            text-shadow: 
                0 0 18px rgba(255, 255, 255, 1),
                0 0 10px rgba(255, 255, 255, 0.9),
                0 2px 6px rgba(255, 255, 255, 0.8);
        }

        /* Стек кнопок */
        .buttons-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Ультра-жидкое стекло Liquid Glass (iOS Spec) */
        .liquid-glass-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-radius: 36px;
            text-decoration: none;
            position: relative;
            overflow: hidden;

            /* Многослойное матовое преломление */
            background: linear-gradient(135deg, 
                rgba(255, 255, 255, 0.86) 0%, 
                rgba(255, 255, 255, 0.52) 50%, 
                rgba(255, 255, 255, 0.68) 100%
            );
            backdrop-filter: blur(35px) saturate(210%);
            -webkit-backdrop-filter: blur(35px) saturate(210%);

            /* Каустический ободок стекла с двойным световым преломлением */
            border: 1.5px solid rgba(255, 255, 255, 0.85);
            border-top: 1.8px solid rgba(255, 255, 255, 0.98);
            border-bottom: 1.2px solid rgba(255, 255, 255, 0.45);

            /* Объемные световые тени + внутренний линзовый блик */
            box-shadow: 
                0 25px 45px -12px rgba(255, 100, 130, 0.22),
                0 16px 28px -8px rgba(0, 0, 0, 0.06),
                inset 0 2px 3px 0 rgba(255, 255, 255, 1),
                inset 0 -2px 3px 0 rgba(255, 200, 215, 0.35),
                inset 1px 0 2px 0 rgba(255, 255, 255, 0.6);

            transition: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.18s ease;
        }

        .liquid-glass-card:active {
            transform: scale(0.975);
            box-shadow: 
                0 12px 22px -6px rgba(255, 100, 130, 0.18),
                0 8px 14px -4px rgba(0, 0, 0, 0.05),
                inset 0 1.5px 2px 0 rgba(255, 255, 255, 0.95);
        }

        .card-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* Мягкая стеклянная линза под иконкой кнопки */
        .icon-lens {
            width: 48px;
            height: 48px;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 235, 240, 0.75) 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 
                0 8px 18px -4px rgba(255, 7, 58, 0.18),
                inset 0 1.5px 1.5px #ffffff,
                inset 0 -1px 2px rgba(255, 7, 58, 0.08);
        }

        .icon-lens svg {
            width: 23px;
            height: 23px;
            stroke: var(--brand);
            fill: none;
            stroke-width: 2.3;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .card-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 900;
            letter-spacing: -0.01em;
            text-transform: uppercase;
            color: #0A0D14;
        }

        .card-sub {
            font-size: 13px;
            font-weight: 600;
            color: #4B5565;
            letter-spacing: -0.01em;
        }

        .chevron {
            stroke: #E11D48;
            stroke-width: 2.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            opacity: 0.8;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        .liquid-glass-card:hover .chevron,
        .liquid-glass-card:active .chevron {
            opacity: 1;
            transform: translateX(3px);
        }
    </style>
</head>
<body>

    <!-- Разметка сетки -->
    <div class="grid-lines">
        <div class="grid-line"></div>
        <div class="grid-line"></div>
        <div class="grid-line"></div>
        <div class="grid-line"></div>
    </div>

    <!-- Мягкий розово-красный градиент снизу -->
    <div class="bottom-mesh"></div>

    <div class="stage-wrapper">
        <!-- Полноразмерный макет iPhone по референсу -->
        <div class="phone-mockup-frame" aria-hidden="true">
            <img src="logo2.png" alt="Phone Shell">
        </div>

        <!-- Интерфейсный слой Liquid Glass поверх экрана телефона -->
        <main class="ui-overlay">
            <!-- Шапка с антибликовым световым щитом -->
            <header class="header">
                <div class="logo-wrap">
                    <div class="apple-app-icon">
                        <img src="logo.png" alt="ALPAN" class="brand-logo-img">
                    </div>

            </header>

            <!-- Кнопки Liquid Glass -->
            <div class="buttons-group">
                <!-- 1. НАШ БОТ -->
                <a href="https://t.me/AlpanVPNrobot?start=alpan" target="_blank" rel="noopener" class="liquid-glass-card">
                    <div class="card-left">
                        <div class="icon-lens">
                            <svg viewBox="0 0 24 24">
                                <rect x="3" y="11" width="18" height="10" rx="4"></rect>
                                <circle cx="9" cy="16" r="1.5" fill="var(--brand)"></circle>
                                <circle cx="15" cy="16" r="1.5" fill="var(--brand)"></circle>
                                <path d="M12 7v4"></path>
                                <line x1="8" y1="2" x2="8" y2="4"></line>
                                <line x1="16" y1="2" x2="16" y2="4"></line>
                            </svg>
                        </div>
                        <div class="card-text">
                            <span class="card-title">НАШ БОТ</span>
                            <span class="card-sub">t.me/AlpanVPNrobot</span>
                        </div>
                    </div>
                    <svg class="chevron" width="18" height="18" viewBox="0 0 24 24">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </a>

                <!-- 2. НАШ КАНАЛ -->
                <a href="https://t.me/alpanvpn" target="_blank" rel="noopener" class="liquid-glass-card">
                    <div class="card-left">
                        <div class="icon-lens">
                            <svg viewBox="0 0 24 24">
                                <line x1="22" y1="2" x2="11" y2="13"></line>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                            </svg>
                        </div>
                        <div class="card-text">
                            <span class="card-title">НАШ КАНАЛ</span>
                            <span class="card-sub">t.me/alpanvpn</span>
                        </div>
                    </div>
                    <svg class="chevron" width="18" height="18" viewBox="0 0 24 24">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </a>

                <!-- 3. ПОДДЕРЖКА -->
                <a href="https://t.me/AlpanSupport" target="_blank" rel="noopener" class="liquid-glass-card">
                    <div class="card-left">
                        <div class="icon-lens">
                            <svg viewBox="0 0 24 24">
                                <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
                                <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
                            </svg>
                        </div>
                        <div class="card-text">
                            <span class="card-title">ПОДДЕРЖКА</span>
                            <span class="card-sub">t.me/AlpanSupport</span>
                        </div>
                    </div>
                    <svg class="chevron" width="18" height="18" viewBox="0 0 24 24">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </a>
            </div>
        </main>
    </div>

</body>
</html>
