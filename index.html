<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALPAN VPN — Лучший впн в Дагестане</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand: #FF073A;
            --brand-light: rgba(255, 7, 58, 0.08);
            --brand-glow: rgba(255, 7, 58, 0.28);
            --text-dark: #0D1117;
            --text-muted: #6E7681;
            --card-bg: rgba(255, 255, 255, 0.88);
            --card-border: rgba(255, 255, 255, 0.95);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #F8F9FC;
            color: var(--text-dark);
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* Тонкая вертикальная направляющая сетка (как на 2 картинке) */
        .grid-lines {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            height: 100%;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 0;
            padding: 0 20px;
        }

        .grid-line {
            width: 1px;
            height: 100%;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.04) 0%, rgba(255, 7, 58, 0.08) 100%);
        }

        /* Градиентное и пиксельное свечение снизу */
        .bottom-mesh {
            position: fixed;
            bottom: -80px;
            left: 50%;
            transform: translateX(-50%);
            width: 120%;
            max-width: 600px;
            height: 420px;
            background: radial-gradient(ellipse at 50% 100%, var(--brand-glow) 0%, rgba(255, 7, 58, 0.1) 45%, transparent 75%);
            pointer-events: none;
            z-index: 0;
            filter: blur(40px);
        }

        .pixel-pattern {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 280px;
            background-image: 
                linear-gradient(to right, rgba(255, 7, 58, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 7, 58, 0.03) 1px, transparent 1px);
            background-size: 24px 24px;
            mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, transparent 100%);
            -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, transparent 100%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            width: 100%;
            max-width: 390px;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Шапка */
        .header {
            text-align: center;
            margin-bottom: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: var(--brand);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(255, 7, 58, 0.35);
        }

        .logo-icon svg {
            width: 24px;
            height: 24px;
            fill: #FFFFFF;
        }

        .title {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -0.02em;
            color: var(--text-dark);
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: -0.01em;
        }

        /* Стек кнопок */
        .buttons-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            text-decoration: none;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.04), 0 4px 12px rgba(255, 7, 58, 0.03);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .link-card:active {
            transform: scale(0.975);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.03);
        }

        .card-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .icon-box {
            width: 48px;
            height: 48px;
            background: var(--brand-light);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .icon-box svg {
            width: 24px;
            height: 24px;
            stroke: var(--brand);
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .card-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 800;
            color: var(--text-dark);
            letter-spacing: -0.01em;
            text-transform: uppercase;
        }

        .card-sub {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .chevron {
            stroke: #C4C8D0;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: stroke 0.15s ease;
        }

        .link-card:hover .chevron,
        .link-card:active .chevron {
            stroke: var(--brand);
        }
    </style>
</head>
<body>

    <!-- Направляющие линии сетки -->
    <div class="grid-lines">
        <div class="grid-line"></div>
        <div class="grid-line"></div>
        <div class="grid-line"></div>
        <div class="grid-line"></div>
    </div>

    <!-- Нижнее фирменное свечение и пиксели -->
    <div class="bottom-mesh"></div>
    <div class="pixel-pattern"></div>

    <main class="container">
        <!-- Шапка: Лого + Заголовки -->
        <header class="header">
            <div class="logo-wrap">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3zm3.2 8.3l-2.4 3.2a1 1 0 0 1-1.6 0l-2.4-3.2A1 1 0 0 1 9.6 9h4.8a1 1 0 0 1 .8 1.3z"/>
                    </svg>
                </div>
                <h1 class="title">ALPAN VPN</h1>
            </div>
            <p class="subtitle">Лучший впн в Дагестане.</p>
        </header>

        <!-- Кнопки -->
        <div class="buttons-group">
            <!-- 1. НАШ БОТ (с твоей новой ссылкой) -->
            <a href="https://t.me/AlpanVPNrobot?start=alpan" target="_blank" rel="noopener" class="link-card">
                <div class="card-left">
                    <div class="icon-box">
                        <svg viewBox="0 0 24 24">
                            <rect x="3" y="11" width="18" height="10" rx="4"></rect>
                            <circle cx="9" cy="16" r="1.5" fill="var(--brand)"></circle>
                            <circle cx="15" cy="16" r="1.5" fill="var(--brand)"></circle>
                            <path d="M12 7v4"></path>
                            <line x1="8" y1="2" x2="8" y2="4"></line>
                            <line x1="16" y1="2" x2="16" y2="4"></line>
                        </svg>
                    </div>
                    <div class="card-text">
                        <span class="card-title">НАШ БОТ</span>
                        <span class="card-sub">t.me/AlpanVPNrobot</span>
                    </div>
                </div>
                <svg class="chevron" width="18" height="18" viewBox="0 0 24 24">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </a>

            <!-- 2. НАШ КАНАЛ -->
            <a href="https://t.me/alpanvpn" target="_blank" rel="noopener" class="link-card">
                <div class="card-left">
                    <div class="icon-box">
                        <svg viewBox="0 0 24 24">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </div>
                    <div class="card-text">
                        <span class="card-title">НАШ КАНАЛ</span>
                        <span class="card-sub">t.me/alpanvpn</span>
                    </div>
                </div>
                <svg class="chevron" width="18" height="18" viewBox="0 0 24 24">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </a>

            <!-- 3. ПОДДЕРЖКА -->
            <a href="https://t.me/AlpanSupport" target="_blank" rel="noopener" class="link-card">
                <div class="card-left">
                    <div class="icon-box">
                        <svg viewBox="0 0 24 24">
                            <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
                            <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
                        </svg>
                    </div>
                    <div class="card-text">
                        <span class="card-title">ПОДДЕРЖКА</span>
                        <span class="card-sub">t.me/AlpanSupport</span>
                    </div>
                </div>
                <svg class="chevron" width="18" height="18" viewBox="0 0 24 24">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </a>
        </div>
    </main>

</body>
</html>
