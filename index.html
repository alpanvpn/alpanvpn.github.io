<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ALPAN VPN</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 50% 25%, #ff1c49 0%, #ff0137 65%, #db002c 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 52px 24px 36px;
      color: #ffffff;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Верхний блок: Логотип слева + Название справа */
    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 24px;
      width: 100%;
    }

    .logo-img {
      width: 82px;
      height: 82px;
      object-fit: contain;
      filter: drop-shadow(0 10px 22px rgba(0, 0, 0, 0.28));
    }

    h1 {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      text-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
    }

    /* Подзаголовок */
    .subtitle {
      font-size: 21px;
      font-weight: 700;
      margin-bottom: 36px;
      text-align: center;
      letter-spacing: -0.2px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.16);
    }

    /* Кнопки-карточки */
    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .link-card {
      background: linear-gradient(180deg, #ffffff 0%, #f7f8fa 100%);
      border-radius: 26px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      text-decoration: none;
      box-shadow: 0 14px 30px rgba(150, 0, 25, 0.42), 0 4px 10px rgba(0, 0, 0, 0.12);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      cursor: pointer;
    }

    .link-card:active {
      transform: scale(0.975);
      box-shadow: 0 6px 16px rgba(150, 0, 25, 0.35);
    }

    /* Розовая подложка под иконку */
    .icon-box {
      width: 52px;
      height: 52px;
      border-radius: 18px;
      background: #fbeef0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-right: 18px;
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.9), 0 2px 6px rgba(255, 1, 55, 0.08);
    }

    .icon-box svg {
      width: 26px;
      height: 26px;
      stroke: #ff0137;
      fill: none;
      stroke-width: 2.3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Текстовая колонка внутри кнопки */
    .text-box {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      text-align: left;
    }

    .title {
      font-size: 16px;
      font-weight: 800;
      color: #121316;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .meta {
      font-size: 13.5px;
      color: #636773;
      font-weight: 500;
    }

    /* Стрелка справа */
    .arrow svg {
      width: 18px;
      height: 18px;
      stroke: #1f2024;
      fill: none;
      stroke-width: 2.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="header">
      <img src="logo.png" alt="ALPAN VPN" class="logo-img">
      <h1>ALPAN VPN</h1>
    </div>

    <div class="subtitle">Лучший впн в Дагестане.</div>

    <div class="links-list">
      <!-- Бот -->
      <a href="https://t.me/AlpanVPNrobot" class="link-card">
<div class="icon-box">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="10" width="18" height="11" rx="3"></rect>
            <circle cx="12" cy="4" r="2"></circle>
            <path d="M12 6v4"></path>
            <line x1="8" y1="15" x2="8.01" y2="15"></line>
            <line x1="16" y1="15" x2="16.01" y2="15"></line>
          </svg>
        </div>
        <div class="text-box">
          <span class="title">НАШ БОТ</span>
          <span class="meta">ссылка alpanvpnrobot</span>
        </div>
        <div class="arrow">
          <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </div>
      </a>

      <!-- Канал -->
      <a href="https://t.me/alpanvpn" class="link-card">
        <div class="icon-box">
          <svg viewBox="0 0 24 24" style="transform: rotate(-10deg);">
            <polygon points="5 3 20 12 5 21 5 3"></polygon>
          </svg>
        </div>
        <div class="text-box">
          <span class="title">НАШ КАНАЛ</span>
          <span class="meta">ссылка alpanvpn</span>
        </div>
        <div class="arrow">
          <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </div>
      </a>

      <!-- Поддержка -->
      <a href="https://t.me/AlpanSupport" class="link-card">
        <div class="icon-box">
          <svg viewBox="0 0 24 24">
            <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
            <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
          </svg>
        </div>
        <div class="text-box">
          <span class="title">ПОДДЕРЖКА</span>
          <span class="meta">ссылка @AlpanSupport</span>
        </div>
        <div class="arrow">
          <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </div>
      </a>
    </div>

  </div>

</body>
</html>
