<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALPAN VPN — Лучший VPN в Дагестане</title>
    <!-- Подключение премиального шрифта Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --brand: #FF073A;
            --brand-dark: #D50028;
            --brand-glow: rgba(255, 7, 58, 0.28);
            --text-primary: #0A0D14;
            --text-secondary: #525D6F;
            --bg-color: #F6F8FC;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 36px 20px 48px;
            position: relative;
            overflow-x: hidden;
            color: var(--text-primary);
        }

        /* Декоративная фоновая сетка */
        .bg-grid {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(10, 13, 20, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(10, 13, 20, 0.03) 1px, transparent 1px);
            background-size: 48px 48px;
            mask-image: radial-gradient(circle at 50% 50%, black 30%, transparent 85%);
            -webkit-mask-image: radial-gradient(circle at 50% 50%, black 30%, transparent 85%);
            pointer-events: none;
            z-index: 0;
        }

        /* Фоновые градиентные сферы (Ambient Glow) */
        .ambient-orb-1 {
            position: fixed;
            top: -10%;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 7, 58, 0.14) 0%, transparent 70%);
            filter: blur(60px);
            pointer-events: none;
            z-index: 0;
        }

        .ambient-orb-2 {
            position: fixed;
            bottom: -15%;
            left: 50%;
            transform: translateX(-50%);
            width: 120%;
            max-width: 800px;
            height: 55vh;
            background: radial-gradient(ellipse 80% 60% at 50% 100%, rgba(255, 30, 75, 0.28) 0%, rgba(255, 110, 140, 0.12) 55%, transparent 100%);
            filter: blur(55px);
            pointer-events: none;
            z-index: 0;
        }

        /* Главный контейнер (Адаптивный: колонка на мобильном, 2 колонки на ПК) */
        .stage-wrapper {
            width: 100%;
            max-width: 375px;
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Секция со смартфоном */
        .phone-showcase {
            position: absolute;
            top: -16px;
            left: 50%;
            transform: translateX(-50%);
            width: 340px;
            max-width: 90vw;
            pointer-events: none;
            z-index: 1;
            display: flex;
            justify-content: center;
            
            /* Плавное растворение нижней части телефона на мобильных */
            mask-image: linear-gradient(to top, transparent 2%, black 42%, black 100%);
            -webkit-mask-image: linear-gradient(to top, transparent 2%, black 42%, black 100%);

            animation: phoneReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            will-change: transform, opacity;
        }

        .phone-showcase img {
            width: 100%;
            height: auto;
            display: block;
            filter: 
                drop-shadow(0 25px 45px rgba(255, 7, 58, 0.22)) 
                drop-shadow(0 10px 20px rgba(10, 13, 20, 0.08));
        }

        /* Слой контента и карточек */
        .ui-overlay {
            width: 100%;
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 230px; /* Отступ под экран телефона на мобильных */
        }

        /* Статус-бейдж над шапкой */
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 8px 20px -4px rgba(255, 7, 58, 0.15), 0 2px 6px rgba(0, 0, 0, 0.04);
            margin-bottom: 12px;
            font-size: 11.5px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.01em;
            animation: slideUpFade 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.1s backwards;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: #10B981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
            animation: pulseDot 2s infinite;
        }

        /* Шапка бренда (Liquid Glass Pro) */
        .header-card {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 22px;
            border-radius: 30px;
            margin-bottom: 14px;
            position: relative;
            overflow: hidden;

            background: linear-gradient(135deg, 
                rgba(255, 255, 255, 0.90) 0%, 
                rgba(255, 255, 255, 0.65) 50%, 
                rgba(255, 255, 255, 0.82) 100%
            );
            backdrop-filter: blur(36px) saturate(200%);
            -webkit-backdrop-filter: blur(36px) saturate(200%);

            border: 1.5px solid rgba(255, 255, 255, 0.9);
            border-top: 2px solid #FFFFFF;
            border-bottom: 1.5px solid rgba(255, 255, 255, 0.55);

            box-shadow: 
                0 22px 44px -12px rgba(255, 50, 90, 0.18),
                0 10px 20px -6px rgba(10, 13, 20, 0.04),
                inset 0 2px 3px 0 rgba(255, 255, 255, 1),
                inset 0 -2px 3px 0 rgba(255, 190, 205, 0.25);

            animation: slideUpFade 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.2s backwards;
        }

        .logo-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 13px;
            margin-bottom: 6px;
        }

        /* Объемная иконка для белого логотипа logo1.png */
        .apple-app-icon {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            background: linear-gradient(145deg, #FF2452 0%, #D10026 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: relative;
            border: 1.5px solid rgba(255, 255, 255, 0.55);
            box-shadow: 
                0 12px 24px -4px rgba(229, 9, 48, 0.5),
                0 4px 10px -2px rgba(229, 9, 48, 0.3),
                inset 0 1.5px 2px 0 rgba(255, 255, 255, 0.75),
                inset 0 -2px 3px 0 rgba(0, 0, 0, 0.25);
        }

        .brand-logo-img {
            width: 26px;
            height: 26px;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.15));
        }

        .title {
            font-size: 27px;
            font-weight: 900;
            letter-spacing: -0.03em;
            text-transform: uppercase;
            background: linear-gradient(180deg, #FF1A45 0%, #C80024 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 12px rgba(255, 7, 58, 0.2));
        }

        .subtitle {
            font-size: 13.5px;
            font-weight: 700;
            color: var(--text-secondary);
            letter-spacing: -0.01em;
        }

        /* Группа кнопок */
        .buttons-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Карточки-кнопки (Liquid Glass) */
        .liquid-glass-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 18px;
            border-radius: 26px;
            text-decoration: none;
            position: relative;
            overflow: hidden;

            background: linear-gradient(135deg, 
                rgba(255, 255, 255, 0.88) 0%, 
                rgba(255, 255, 255, 0.58) 50%, 
                rgba(255, 255, 255, 0.76) 100%
            );
            backdrop-filter: blur(32px) saturate(200%);
            -webkit-backdrop-filter: blur(32px) saturate(200%);

            border: 1.5px solid rgba(255, 255, 255, 0.88);
            border-top: 2px solid #FFFFFF;
            border-bottom: 1.5px solid rgba(255, 255, 255, 0.5);

            box-shadow: 
                0 18px 36px -10px rgba(255, 70, 105, 0.16),
                0 10px 20px -6px rgba(10, 13, 20, 0.04),
                inset 0 2px 2.5px 0 rgba(255, 255, 255, 1),
                inset 0 -1.5px 2.5px 0 rgba(255, 200, 215, 0.28);

            transition: 
                transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), 
                box-shadow 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                border-color 0.25s ease;
        }

        .liquid-glass-card:nth-child(1) { animation: slideUpFade 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.3s backwards; }
        .liquid-glass-card:nth-child(2) { animation: slideUpFade 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.4s backwards; }
        .liquid-glass-card:nth-child(3) { animation: slideUpFade 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.5s backwards; }

        /* Акцент на первой главной кнопке (Бот) */
        .liquid-glass-card.primary-card {
            background: linear-gradient(135deg, 
                rgba(255, 255, 255, 0.95) 0%, 
                rgba(255, 240, 244, 0.75) 50%, 
                rgba(255, 255, 255, 0.90) 100%
            );
            border-color: rgba(255, 180, 195, 0.65);
            border-top-color: #FFFFFF;
            box-shadow: 
                0 20px 40px -10px rgba(255, 7, 58, 0.24),
                0 10px 20px -6px rgba(10, 13, 20, 0.05),
                inset 0 2px 3px 0 #FFFFFF;
        }

        /* Блик при наведении (для ПК) */
        .liquid-glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
            transform: skewX(-25deg);
            transition: left 0.6s ease;
            pointer-events: none;
        }

        .liquid-glass-card:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 
                0 24px 44px -10px rgba(255, 40, 85, 0.25),
                0 12px 24px -6px rgba(10, 13, 20, 0.06),
                inset 0 2px 3px 0 #FFFFFF;
        }

        .liquid-glass-card:hover::before {
            left: 150%;
        }

        .liquid-glass-card:active {
            transform: scale(0.975);
        }

        .card-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Капсула иконки */
        .icon-lens {
            width: 46px;
            height: 46px;
            background: linear-gradient(145deg, #FFFFFF 0%, #FFF0F3 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.95);
            box-shadow: 
                0 8px 18px -4px rgba(255, 7, 58, 0.18),
                inset 0 1.5px 1.5px #FFFFFF,
                inset 0 -1px 2px rgba(255, 7, 58, 0.08);
            transition: transform 0.25s ease, background 0.25s ease;
        }

        .primary-card .icon-lens {
            background: linear-gradient(145deg, #FF1E4A 0%, #D6002A 100%);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 
                0 10px 20px -4px rgba(255, 7, 58, 0.4),
                inset 0 1.5px 2px rgba(255, 255, 255, 0.6);
        }

        .icon-lens svg {
            width: 22px;
            height: 22px;
            stroke: var(--brand);
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .primary-card .icon-lens svg {
            stroke: #FFFFFF;
        }

        .primary-card .icon-lens svg circle {
            fill: #FFFFFF;
        }

        .card-text {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .card-title-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title {
            font-size: 15px;
            font-weight: 900;
            letter-spacing: -0.01em;
            text-transform: uppercase;
            color: var(--text-primary);
        }

        .badge-hot {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            padding: 2px 7px;
            border-radius: 6px;
            background: rgba(255, 7, 58, 0.12);
            color: var(--brand);
            letter-spacing: 0.02em;
        }

        .card-sub {
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: -0.01em;
        }

        /* Правая стрелочка в кружке */
        .action-arrow {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 7, 58, 0.07);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.25s ease, transform 0.25s ease;
        }

        .chevron {
            stroke: var(--brand);
            stroke-width: 2.6;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: transform 0.2s ease, stroke 0.2s ease;
        }

        .liquid-glass-card:hover .action-arrow {
            background: var(--brand);
            transform: scale(1.06);
        }

        .liquid-glass-card:hover .chevron {
            stroke: #FFFFFF;
            transform: translateX(1px);
        }

        /* Анимации */
        @keyframes phoneReveal {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(45px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateX(-50%) translateY(0) scale(1);
            }
        }

        @keyframes slideUpFade {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulseDot {
            0%, 100% { box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2); }
            50% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0.05); }
        }

        @keyframes floatPhoneDesktop {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-14px) rotate(0.6deg); }
        }

        /* =========================================================
           ДЕСКТОПНАЯ ВЕРСИЯ (Широкие экраны, Ноутбуки, ПК)
           ========================================================= */
        @media (min-width: 880px) {
            body {
                padding: 40px 60px;
            }

            .stage-wrapper {
                max-width: 960px;
                display: grid;
                grid-template-columns: 1.05fr 0.95fr;
                gap: 64px;
                align-items: center;
            }

            /* На ПК карточки слева, телефон справа */
            .ui-overlay {
                order: 1;
                margin-top: 0;
                align-items: flex-start;
            }

            .phone-showcase {
                order: 2;
                position: relative;
                top: auto;
                left: auto;
                transform: none;
                width: 100%;
                max-width: 410px;
                justify-self: center;
                /* Более мягкая маска снизу для ПК-презентации */
                mask-image: linear-gradient(to top, transparent 0%, black 22%, black 100%);
                -webkit-mask-image: linear-gradient(to top, transparent 0%, black 22%, black 100%);
                animation: floatPhoneDesktop 6s ease-in-out infinite;
            }

            /* Декоративный светящийся пьедестал за телефоном на ПК */
            .phone-showcase::before {
                content: '';
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                width: 340px;
                height: 340px;
                border-radius: 50%;
                background: radial-gradient(circle, rgba(255, 7, 58, 0.24) 0%, rgba(255, 7, 58, 0.05) 55%, transparent 75%);
                z-index: -1;
                filter: blur(25px);
            }

            .header-card {
                align-items: flex-start;
                padding: 28px 30px;
                margin-bottom: 18px;
                border-radius: 32px;
            }

            .logo-wrap {
                gap: 16px;
                margin-bottom: 10px;
            }

            .apple-app-icon {
                width: 54px;
                height: 54px;
                border-radius: 16px;
            }

            .brand-logo-img {
                width: 30px;
                height: 30px;
            }

            .title {
                font-size: 34px;
            }

            .subtitle {
                font-size: 15.5px;
            }

            .buttons-group {
                gap: 14px;
            }

            .liquid-glass-card {
                padding: 18px 22px;
                border-radius: 28px;
            }

            .icon-lens {
                width: 50px;
                height: 50px;
                border-radius: 18px;
            }

            .card-title {
                font-size: 16px;
            }

            .card-sub {
                font-size: 13.5px;
            }
        }
    </style>
</head>
<body>
