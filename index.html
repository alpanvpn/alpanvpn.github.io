<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALPAN VPN — Лучший впн в Дагестане</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand: #FF073A;
            --brand-light: rgba(255, 7, 58, 0.08);
            --brand-glow: rgba(255, 7, 58, 0.42);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #F8F9FD;
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* Вертикальные направляющие линии */
        .grid-lines {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 440px;
            height: 100%;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 0;
            padding: 0 16px;
        }

        .grid-line {
            width: 1px;
            height: 100%;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.04) 0%, rgba(255, 7, 58, 0.12) 100%);
        }

        /* Красный цвет снизу, доходящий до первой кнопки */
        .bottom-mesh {
            position: fixed;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 130%;
            max-width: 680px;
            height: 75vh;
            background: radial-gradient(ellipse 90% 70% at 50% 95%, var(--brand-glow) 0%, rgba(255, 7, 58, 0.22) 50%, rgba(255, 7, 58, 0.06) 80%, transparent 100%);
            pointer-events: none;
            z-index: 0;
            filter: blur(55px);
        }

        /* Пиксельный паттерн под кнопками */
        .pixel-pattern {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70vh;
            background-image: 
                linear-gradient(to right, rgba(255, 7, 58, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 7, 58, 0.05) 1px, transparent 1px);
            background-size: 26px 26px;
            mask-image: linear-gradient(to top, rgba(0,0,0,1) 15%, transparent 100%);
            -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 15%, transparent 100%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            width: 100%;
            max-width: 390px;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Шапка */
        .header {
            text-align: center;
            margin-bottom: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        /* Логотип logo.png */
        .brand-logo {
            height: 46px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(255, 7, 58, 0.3));
        }

        /* ALPAN VPN — фирменный красный с объемом */
        .title {
            font-size: 29px;
            font-weight: 900;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            background: linear-gradient(180deg, #FF2B54 0%, #FF073A 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 8px rgba(255, 7, 58, 0.25));
        }

        /* Подзаголовок с объемным градиентом */
        .subtitle {
            font-size: 16px;
            font-weight: 700;
            background: linear-gradient(180deg, #181E27 0%, #4B5565 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.01em;
        }

        /* Группа кнопок */
        .buttons-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Выделяющийся Liquid Glass с глубокой тенью и стеклянным отблеском */
        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px;
            border-radius: 30px;
            text-decoration: none;
            
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0.45) 100%);
            backdrop-filter: blur(28px) saturate(190%);
            -webkit-backdrop-filter: blur(28px) saturate(190%);
            
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            border-bottom: 1.5px solid rgba(255, 255, 255, 0.5);

            /* Мощные тени + внутренний стеклянный свет */
            box-shadow: 
                0 20px 38px -10px rgba(0, 0, 0, 0.08),
                0 12px 28px -6px rgba(255, 7, 58, 0.18),
                inset 0 1.5px 1.5px 0 rgba(255, 255, 255, 0.95),
                inset 0 -2px 4px 0 rgba(0, 0, 0, 0.02);

            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .link-card:active {
            transform: scale(0.975);
            box-shadow: 
                0 10px 20px -6px rgba(0, 0, 0, 0.06),
                0 6px 16px -4px rgba(255, 7, 58, 0.14),
                inset 0 1.5px 1.5px 0 rgba(255, 255, 255, 0.95);
        }

        .card-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* Стеклянный контейнер для иконки */
        .icon-box {
            width: 48px;
            height: 48px;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.9), rgba(255, 230, 235, 0.7));
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 12px rgba(255, 7, 58, 0.12), inset 0 1px 1px #fff;
        }

        .icon-box svg {
            width: 24px;
            height: 24px;
            stroke: var(--brand);
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .card-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        /* Заголовки кнопок: градиент от черного к темно-серому */
        .card-title {
            font-size: 16px;
            font-weight: 900;
            letter-spacing: -0.01em;
            text-transform: uppercase;
            background: linear-gradient(180deg, #000000 0%, #2B3340 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Подписи кнопок: плавный объемный серый */
        .card-sub {
            font-size: 13px;
            font-weight: 600;
            background: linear-gradient(180deg, #4B5565 0%, #6E7987 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .chevron {
            stroke: #B8BFC9;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: stroke 0.15s ease, transform 0.15s ease;
        }

        .link-card:hover .chevron,
        .link-card:active .chevron {
            stroke: var(--brand);
            transform: translateX(2px);
        }
    </style>
</head>
<body>

    <div class="grid-lines">
        <div class="grid-line"></div>
        <div class="grid-line"></div>
        <div class="grid-line"></div>
        <div class="grid-line"></div>
    </div>

    <!-- Красное свечение и сетка снизу до первой кнопки -->
    <div class="bottom-mesh"></div>
    <div class="pixel-pattern"></div>

    <main class="container">
        <!-- Шапка -->
        <header class="header">
            <div class="logo-wrap">
                <img src="logo.png" alt="ALPAN VPN" class="brand-logo">
                <h1 class="title">ALPAN VPN</h1>
            </div>
            <p class="subtitle">Лучший впн в Дагестане.</p>
        </header>

        <!-- Кнопки -->
        <div class="buttons-group">
            <!-- 1. НАШ БОТ -->
            <a href="https://t.me/AlpanVPNrobot?start=alpan" target="_blank" rel="noopener" class="link-card">
                <div class="card-left">
                    <div class="icon-box">
                        <svg viewBox="0 0 24 24">
                            <rect x="3" y="11" width="18" height="10" rx="4"></rect>
                            <circle cx="9" cy="16" r="1.5" fill="var(--brand)"></circle>
                            <circle cx="15" cy="16" r="1.5" fill="var(--brand)"></circle>
                            <path d="M12 7v4"></path>
                            <line x1="8" y1="2" x2="8" y2="4"></line>
                            <line x1="16" y1="2" x2="16" y2="4"></line>
                        </svg>
                    </div>
                    <div class="card-text">
                        <span class="card-title">НАШ БОТ</span>
                        <span class="card-sub">t.me/AlpanVPNrobot</span>
                    </div>
                </div>
                <svg class="chevron" width="18" height="18" viewBox="0 0 24 24">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </a>

            <!-- 2. НАШ КАНАЛ -->
            <a href="https://t.me/alpanvpn" target="_blank" rel="noopener" class="link-card">
                <div class="card-left">
                    <div class="icon-box">
                        <svg viewBox="0 0 24 24">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </div>
                    <div class="card-text">
                        <span class="card-title">НАШ КАНАЛ</span>
                        <span class="card-sub">t.me/alpanvpn</span>
                    </div>
                </div>
                <svg class="chevron" width="18" height="18" viewBox="0 0 24 24">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </a>

            <!-- 3. ПОДДЕРЖКА -->
            <a href="https://t.me/AlpanSupport" target="_blank" rel="noopener" class="link-card">
                <div class="card-left">
                    <div class="icon-box">
                        <svg viewBox="0 0 24 24">
                            <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
                            <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
                        </svg>
                    </div>
                    <div class="card-text">
                        <span class="card-title">ПОДДЕРЖКА</span>
                        <span class="card-sub">t.me/AlpanSupport</span>
                    </div>
                </div>
                <svg class="chevron" width="18" height="18" viewBox="0 0 24 24">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </a>
        </div>
    </main>

</body>
</html>
