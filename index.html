<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALPAN VPN — Стабильный обход глушилок</title>
    <!-- Эталонная современная типографика: Inter + Manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-void: #040406;
            --bg-frame: #08070A;
            --crimson-core: #FF1240;
            --crimson-deep: #8A001D;
            --crimson-glow: rgba(255, 18, 64, 0.38);
            --glass-surface: rgba(255, 255, 255, 0.045);
            --glass-border: rgba(255, 255, 255, 0.11);
            --glass-highlight: rgba(255, 255, 255, 0.22);
            --text-white: #F9FAFB;
            --text-secondary: rgba(255, 255, 255, 0.62);
            --text-muted: rgba(255, 255, 255, 0.42);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-void);
            color: var(--text-white);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            position: relative;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Внешние тонкие орбитальные круги (как за рамкой на референсе) */
        .outer-orbit {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 92vw;
            max-width: 1180px;
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            border: 1px solid rgba(255, 18, 64, 0.12);
            pointer-events: none;
            z-index: 0;
        }

        /* Внешнее фоновое свечение по краям экрана */
        .ambient-backdrop {
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 18% 20%, rgba(190, 0, 40, 0.25) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(255, 18, 64, 0.18) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* =========================================================
           ГЛАВНОЕ ОКНО-РАМКА (КАК НА СКРИНШОТЕ)
           ========================================================= */
        .showcase-window {
            width: 100%;
            max-width: 1120px;
            min-height: calc(100vh - 32px);
            background: 
                radial-gradient(ellipse 75% 65% at 35% 30%, rgba(165, 5, 38, 0.35) 0%, rgba(45, 3, 14, 0.2) 55%, transparent 100%),
                var(--bg-frame);
            border: 1px solid rgba(255, 255, 255, 0.13);
            border-radius: 32px;
            position: relative;
            z-index: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 18px 28px;
            box-shadow: 
                0 30px 90px rgba(0, 0, 0, 0.85),
                0 0 80px -20px rgba(255, 18, 64, 0.25),
                inset 0 1px 1px rgba(255, 255, 255, 0.18);
        }

        /* =========================================================
           1. ВЕРХНЯЯ СТЕКЛЯННАЯ КАПСУЛА (FLOATING TOP PILL)
           ========================================================= */
        .top-pill-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            position: relative;
            z-index: 10;
        }

        .floating-nav-pill {
            display: inline-flex;
            align-items: center;
            gap: 18px;
            padding: 8px 18px 8px 10px;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.065);
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 
                0 12px 32px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            animation: dropDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-logo-circle {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255, 18, 64, 0.28), rgba(255, 255, 255, 0.06));
            border: 1px solid rgba(255, 255, 255, 0.22);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 16px rgba(255, 18, 64, 0.35);
        }

        .nav-logo-circle img {
            width: 19px;
            height: 19px;
            object-fit: contain;
            display: block;
        }

        .nav-brand-name {
            font-family: 'Manrope', sans-serif;
            font-weight: 800;
            font-size: 13.5px;
            letter-spacing: 0.04em;
            color: #FFFFFF;
        }

        .nav-divider {
            width: 1px;
            height: 16px;
            background: rgba(255, 255, 255, 0.14);
        }

        .nav-tags {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .nav-live-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #FFFFFF;
            font-weight: 600;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #FF1E4D;
            box-shadow: 0 0 10px #FF1E4D;
            animation: pulseGlow 2s infinite;
        }

        /* =========================================================
           2. ЦЕНТРАЛЬНАЯ СЦЕНА: 3D-ФОРМА, ТЕЛЕФОН И ПЛАШКИ
           ========================================================= */
        .stage-grid {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 5;
            margin: auto 0;
            padding-top: 12px;
        }

        /* ЗОНА ТЕЛЕФОНА + АБСТРАКТНАЯ ТЕКСТУРИРОВАННАЯ 3D-ФОРМА (КАК НА РЕФЕРЕНСЕ) */
        .visual-centerpiece {
            position: relative;
            width: 100%;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: -36px;
            pointer-events: none;
        }

        /* Та самая рельефная 3D-форма в красных тонах за телефоном */
        .textured-3d-blob {
            position: absolute;
            width: 270px;
            height: 270px;
            border-radius: 42% 58% 63% 37% / 41% 44% 56% 59%;
            background: 
                radial-gradient(circle at 30% 28%, rgba(255, 95, 125, 0.85) 0%, rgba(225, 10, 52, 0.75) 32%, rgba(95, 0, 22, 0.9) 70%, rgba(15, 0, 5, 0.95) 100%);
            box-shadow: 
                inset 12px 12px 34px rgba(255, 160, 180, 0.45),
                inset -20px -24px 45px rgba(0, 0, 0, 0.85),
                0 0 75px rgba(255, 18, 64, 0.42);
            animation: morphBlob 12s ease-in-out infinite alternate;
            overflow: hidden;
        }

        /* Точечный 3D-паттерн поверх сферы (имитация сетчатой текстуры со скрина) */
        .textured-3d-blob::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(0, 0, 0, 0.55) 1.25px, transparent 1.25px);
            background-size: 6px 6px;
            opacity: 0.65;
            mix-blend-mode: overlay;
        }

        /* Сам телефон под стильным наклоном */
        .tilted-phone {
            position: relative;
            z-index: 3;
            width: 265px;
            max-width: 76vw;
            transform: perspective(1000px) rotate(-9deg) rotateY(8deg) rotateX(4deg);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            mask-image: linear-gradient(to top, transparent 2%, black 35%, black 100%);
            -webkit-mask-image: linear-gradient(to top, transparent 2%, black 35%, black 100%);
            animation: phoneEntrance 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .tilted-phone img {
            width: 100%;
            height: auto;
            display: block;
            filter: 
                drop-shadow(-18px 28px 38px rgba(0, 0, 0, 0.85))
                drop-shadow(0 0 30px rgba(255, 18, 64, 0.25));
        }

        /* =========================================================
           ПРАВАЯ/НИЖНЯЯ ЧАСТЬ: ТИПОГРАФИКА И НОВЫЕ КНОПКИ
           ========================================================= */
        .interaction-dock {
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 6;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Заголовочный блок */
        .hero-copy {
            text-align: center;
            margin-bottom: 4px;
            padding: 0 6px;
            animation: fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.15s backwards;
        }

        .hero-eyebrow {
            display: inline-block;
            font-size: 11.5px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #FF476E;
            margin-bottom: 8px;
        }

        .hero-heading {
            font-family: 'Manrope', sans-serif;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.035em;
            line-height: 1.12;
            color: #FFFFFF;
            margin-bottom: 10px;
            background: linear-gradient(180deg, #FFFFFF 30%, rgba(255, 255, 255, 0.68) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            font-size: 14.5px;
            font-weight: 400;
            line-height: 1.5;
            color: var(--text-secondary);
            letter-spacing: -0.01em;
        }

        /* =========================================================
           НОВЫЕ ПЛАШКИ-КНОПКИ (В СТИЛЕ "JOIN WAITLIST" С РЕФЕРЕНСА)
           ========================================================= */
        
        /* 1. ГЛАВНАЯ КАПСУЛА — НАШ БОТ */
        .waitlist-style-dock {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 16px 16px 16px 20px;
            border-radius: 24px;
            text-decoration: none;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.03) 100%);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.16);
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.6),
                0 0 40px -10px rgba(255, 18, 64, 0.22),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
            position: relative;
            overflow: hidden;
            transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.28s ease, box-shadow 0.28s ease;
            animation: fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.25s backwards;
        }

        /* Мягкий рубиновый отсвет внутри главной капсулы */
        .waitlist-style-dock::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -10%;
            width: 160px;
            height: 160px;
            background: radial-gradient(circle, rgba(255, 18, 64, 0.28) 0%, transparent 70%);
            pointer-events: none;
        }

        .waitlist-style-dock:hover {
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.32);
            box-shadow: 
                0 26px 60px rgba(0, 0, 0, 0.75),
                0 0 50px -8px rgba(255, 18, 64, 0.38),
                inset 0 1px 0 rgba(255, 255, 255, 0.35);
        }

        .waitlist-style-dock:active {
            transform: scale(0.985);
        }

        .dock-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            position: relative;
            z-index: 2;
        }

        .dock-label-row {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        /* Аккуратная векторная иконка Telegram */
        .tg-mini-badge {
            width: 20px;
            height: 20px;
            border-radius: 6px;
            background: rgba(255, 18, 64, 0.2);
            border: 1px solid rgba(255, 18, 64, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FF4D73;
        }

        .dock-title {
            font-family: 'Manrope', sans-serif;
            font-size: 15.5px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #FFFFFF;
        }

        .dock-sub {
            font-size: 13px;
            font-weight: 400;
            color: var(--text-secondary);
            letter-spacing: -0.01em;
        }

        /* Ярко-белая контрастная кнопка-таблетка (1 в 1 как "Join Waitlist" на скрине) */
        .white-pill-btn {
            position: relative;
            z-index: 2;
            background: #FFFFFF;
            color: #060609;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: -0.01em;
            padding: 12px 20px;
            border-radius: 100px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            box-shadow: 0 8px 24px rgba(255, 255, 255, 0.22);
            transition: transform 0.22s ease, background 0.22s ease, box-shadow 0.22s ease;
        }

        .waitlist-style-dock:hover .white-pill-btn {
            background: #F3F4F6;
            transform: scale(1.03);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.35);
        }

        .white-pill-btn svg {
            transition: transform 0.22s ease;
        }

        .waitlist-style-dock:hover .white-pill-btn svg {
            transform: translate(2px, -2px);
        }

        /* 2. ДВЕ НИЖНИЕ СТЕКЛЯННЫЕ ПЛИТКИ (КАНАЛ И ПОДДЕРЖКА) */
        .secondary-bento-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            animation: fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.35s backwards;
        }

        .glass-tile {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 16px;
            padding: 16px 18px;
            border-radius: 22px;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.035);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.09);
            position: relative;
            overflow: hidden;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), background 0.25s ease, border-color 0.25s ease;
        }

        .glass-tile:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.065);
            border-color: rgba(255, 18, 64, 0.45);
        }

        .glass-tile:active {
            transform: scale(0.98);
        }

        .tile-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Стильная минималистичная иконка в кружке */
        .tile-orb-icon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(255, 18, 64, 0.16), rgba(255, 255, 255, 0.03));
            border: 1px solid rgba(255, 255, 255, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FF335C;
            transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease;
        }

        .glass-tile:hover .tile-orb-icon {
            background: var(--crimson-core);
            color: #FFFFFF;
            border-color: rgba(255, 255, 255, 0.35);
        }

        /* Диагональная стрелка в углу плитки */
        .tile-corner-arrow {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            transition: background 0.25s ease, color 0.25s ease, transform 0.25s ease;
        }

        .glass-tile:hover .tile-corner-arrow {
            background: rgba(255, 255, 255, 0.14);
            color: #FFFFFF;
            transform: translate(2px, -2px);
        }

        .tile-bottom {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .tile-title {
            font-family: 'Manrope', sans-serif;
            font-size: 14.5px;
            font-weight: 700;
            letter-spacing: -0.015em;
            color: #FFFFFF;
        }

        .tile-handle {
            font-size: 12px;
            font-weight: 400;
            color: var(--text-muted);
            letter-spacing: -0.01em;
        }

        /* Анимации */
        @keyframes dropDown {
            0% { opacity: 0; transform: translateY(-16px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes phoneEntrance {
            0% {
                opacity: 0;
                transform: perspective(1000px) translateY(35px) rotate(-4deg) scale(0.94);
            }
            100% {
                opacity: 1;
                transform: perspective(1000px) rotate(-9deg) rotateY(8deg) rotateX(4deg) scale(1);
            }
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(18px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes morphBlob {
            0% {
                border-radius: 42% 58% 63% 37% / 41% 44% 56% 59%;
                transform: rotate(0deg) scale(1);
            }
            100% {
                border-radius: 58% 42% 38% 62% / 55% 60% 40% 45%;
                transform: rotate(12deg) scale(1.05);
            }
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.45; transform: scale(0.85); }
        }

        /* =========================================================
           ДЕСКТОПНАЯ ВЕРСИЯ (В ТОЧНОСТИ КОМПОЗИЦИЯ С ВАШЕГО СКРИНА)
           ========================================================= */
        @media (min-width: 900px) {
            body {
                padding: 36px;
            }

            .showcase-window {
                min-height: 690px;
                padding: 32px 56px 48px;
                border-radius: 38px;
            }

            .floating-nav-pill {
                padding: 9px 24px 9px 11px;
                gap: 24px;
            }

            .stage-grid {
                display: grid;
                grid-template-columns: 1.05fr 0.95fr;
                gap: 48px;
                align-items: center;
                padding-top: 0;
            }

            .visual-centerpiece {
                height: 520px;
                margin-bottom: 0;
                pointer-events: auto;
            }

            .textured-3d-blob {
                width: 410px;
                height: 410px;
            }

            .tilted-phone {
                width: 350px;
                max-width: none;
                mask-image: linear-gradient(to top, transparent 0%, black 22%, black 100%);
                -webkit-mask-image: linear-gradient(to top, transparent 0%, black 22%, black 100%);
            }

            .interaction-dock {
                max-width: 470px;
                justify-self: center;
                gap: 18px;
            }

            .hero-copy {
                text-align: left;
                padding: 0;
                margin-bottom: 6px;
            }

            .hero-heading {
                font-size: 40px;
            }

            .hero-subtitle {
                font-size: 16px;
                max-width: 420px;
            }

            .waitlist-style-dock {
                padding: 20px 20px 20px 24px;
                border-radius: 26px;
            }

            .dock-title {
                font-size: 17px;
            }

            .white-pill-btn {
                font-size: 14px;
                padding: 14px 24px;
            }

            .glass-tile {
                padding: 20px 22px;
                border-radius: 24px;
            }

            .tile-title {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- Фоновые орбиты и красное свечение за пределами рамки -->
    <div class="ambient-backdrop" aria-hidden="true"></div>
    <div class="outer-orbit" aria-hidden="true"></div>

    <!-- Главное окно презентации -->
    <div class="showcase-window">
        
        <!-- Верхняя парящая стеклянная капсула с белым логотипом logo.png -->
        <header class="top-pill-wrapper">
            <nav class="floating-nav-pill">
                <div class="nav-brand">
                    <div class="nav-logo-circle">
                        <img src="logo.png" alt="ALPAN">
                    </div>
                    <span class="nav-brand-name">ALPAN VPN</span>
                </div>
                <div class="nav-divider"></div>
                <div class="nav-tags">
                    <span class="nav-live-indicator">
                        <span class="live-dot"></span>
                        Обход активен
                    </span>
                </div>
            </nav>
        </header>

        <!-- Основная сцена -->
        <main class="stage-grid">
            
            <!-- Левая/Верхняя часть: Наклоненный телефон logo2.png на фоне 3D-сферы -->
            <div class="visual-centerpiece" id="phoneScene">
                <div class="textured-3d-blob"></div>
                <div class="tilted-phone" id="tiltedPhone">
                    <img src="logo2.png" alt="Интерфейс ALPAN VPN в Telegram">
                </div>
            </div>

            <!-- Правая/Нижняя часть: Заголовок и новые капсульные кнопки -->
            <div class="interaction-dock">
                
                <div class="hero-copy">
                    <span class="hero-eyebrow">Stealth Protocol • 2026</span>
                    <h1 class="hero-heading">Свободный доступ без ограничений</h1>
                    <p class="hero-subtitle">
                        Стабильно рабочие обходы глушилок и легкое подключение.
                    </p>
                </div>

                <!-- 1. ГЛАВНАЯ КАРТОЧКА БОТА (В стиле "Join Waitlist" с вашего скриншота) -->
                <a href="https://t.me/AlpanVPNrobot?start=alpan" target="_blank" rel="noopener" class="waitlist-style-dock">
                    <div class="dock-info">
                        <div class="dock-label-row">
                            <span class="tg-mini-badge">

    <script>
        const scene = document.getElementById('phoneScene');
        const phone = document.getElementById('tiltedPhone');

        if (window.matchMedia("(min-width: 900px)").matches) {
            document.addEventListener('mousemove', (e) => {
                const xAxis = (window.innerWidth / 2 - e.pageX) / 45;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 45;
                phone.style.transform = `perspective(1000px) rotate(-9deg) rotateY(${8 - xAxis}deg) rotateX(${4 + yAxis}deg)`;
            });
        }
    </script>
