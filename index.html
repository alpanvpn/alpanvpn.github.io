<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALPAN VPN — Стабильный обход глушилок</title>
    <!-- Подключение шрифтов Unbounded (для мощных заголовков) и Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Unbounded:wght@700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #06070B;
            --bg-card: rgba(18, 20, 28, 0.68);
            --bg-card-hover: rgba(26, 29, 40, 0.85);
            --brand: #FF0F42;
            --brand-bright: #FF2E5B;
            --brand-dark: #A80024;
            --text-main: #FFFFFF;
            --text-muted: #949FAF;
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(255, 15, 66, 0.45);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 28px 16px 44px;
            position: relative;
            overflow-x: hidden;
        }

        /* Кибер-сетка на фоне */
        .cyber-grid {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(ellipse 90% 80% at 50% 35%, black 20%, transparent 85%);
            -webkit-mask-image: radial-gradient(ellipse 90% 80% at 50% 35%, black 20%, transparent 85%);
            pointer-events: none;
            z-index: 0;
        }

        /* Ambient-свечения (Неоновые туманности) */
        .glow-top {
            position: fixed;
            top: -120px;
            left: 50%;
            transform: translateX(-50%);
            width: 550px;
            height: 420px;
            background: radial-gradient(circle, rgba(255, 15, 66, 0.28) 0%, rgba(180, 0, 40, 0.08) 50%, transparent 75%);
            filter: blur(70px);
            pointer-events: none;
            z-index: 0;
        }

        .glow-bottom {
            position: fixed;
            bottom: -150px;
            left: 50%;
            transform: translateX(-50%);
            width: 650px;
            height: 450px;
            background: radial-gradient(circle, rgba(255, 15, 66, 0.22) 0%, transparent 70%);
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
        }

        /* Главный контейнер сцены */
        .bento-stage {
            width: 100%;
            max-width: 400px;
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* =========================================
           ЗОНА СМАРТФОНА + РАДАР ОБХОДА БЛОКИРОВОК
           ========================================= */
        .phone-portal {
            position: relative;
            width: 100%;
            height: 255px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            margin-bottom: -24px;
            z-index: 1;
            pointer-events: none;
        }

        /* Кольца радара за телефоном */
        .radar-ring {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 50%;
            border: 1px solid rgba(255, 15, 66, 0.22);
            pointer-events: none;
        }

        .radar-ring-1 {
            width: 260px;
            height: 260px;
            animation: radarPulse 4s ease-out infinite;
        }

        .radar-ring-2 {
            width: 340px;
            height: 340px;
            border-style: dashed;
            border-color: rgba(255, 255, 255, 0.07);
            animation: spinSlow 28s linear infinite;
        }

        .phone-frame {
            width: 310px;
            max-width: 85vw;
            position: relative;
            z-index: 2;
            mask-image: linear-gradient(to top, transparent 4%, black 38%, black 100%);
            -webkit-mask-image: linear-gradient(to top, transparent 4%, black 38%, black 100%);
            animation: phoneFloatIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .phone-frame img {
            width: 100%;
            height: auto;
            display: block;
            filter: drop-shadow(0 20px 50px rgba(255, 15, 66, 0.35));
        }

        /* =========================================
           КОНТЕНТНАЯ BENTO-ПАНЕЛЬ
           ========================================= */
        .bento-content {
            width: 100%;
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 1. ГЛАВНАЯ КАРТОЧКА БРЕНДА */
        .brand-bento-card {
            width: 100%;
            background: linear-gradient(165deg, rgba(28, 31, 44, 0.85) 0%, rgba(14, 16, 23, 0.92) 100%);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-top: 1px solid rgba(255, 255, 255, 0.24);
            border-radius: 28px;
            padding: 22px 20px 18px;
            box-shadow: 
                0 24px 48px -12px rgba(0, 0, 0, 0.7),
                0 0 35px -10px rgba(255, 15, 66, 0.2),
                inset 0 1px 1px rgba(255, 255, 255, 0.15);
            position: relative;
            overflow: hidden;
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s backwards;
        }

        /* Внутренний неоновый блик в углу шапки */
        .brand-bento-card::after {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, rgba(255, 15, 66, 0.35) 0%, transparent 70%);
            filter: blur(20px);
            pointer-events: none;
        }

        /* Верхняя строка шапки: Статус сети */
        .network-status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #10B981;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.25);
            padding: 4px 10px;
            border-radius: 100px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10B981;
            box-shadow: 0 0 8px #10B981;
            animation: blink 2s infinite;
        }

        .protocol-tag {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.02em;
        }

        /* Блок Логотип + Название */
        .brand-identity {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 14px;
        }

        /* 3D-капсула для белого логотипа logo.png */
        .logo-vault {
            width: 54px;
            height: 54px;
            border-radius: 16px;
            background: linear-gradient(135deg, #FF1B4B 0%, #B80028 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.45);
            box-shadow: 
                0 10px 25px -4px rgba(255, 15, 66, 0.65),
                inset 0 2px 3px rgba(255, 255, 255, 0.6),
                inset 0 -2px 4px rgba(0, 0, 0, 0.4);
        }

        .logo-vault img {
            width: 30px;
            height: 30px;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.25));
        }

        .brand-title-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .brand-title {
            font-family: 'Unbounded', sans-serif;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            color: #FFFFFF;
            line-height: 1.1;
            text-shadow: 0 4px 20px rgba(255, 15, 66, 0.4);
        }

        .brand-title span {
            color: var(--brand-bright);
        }

        /* Новый текст описания */
        .brand-description {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.45;
            color: #D5DCE6;
            margin-bottom: 16px;
        }

        /* Мини-бейджи преимуществ (Bento Pills) */
        .feature-chips {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .chip {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 8px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            text-align: center;
        }

        .chip svg {
            width: 15px;
            height: 15px;
            stroke: var(--brand-bright);
            stroke-width: 2.2;
            fill: none;
        }

        .chip span {
            font-size: 10.5px;
            font-weight: 700;
            color: #B8C2D1;
            letter-spacing: -0.01em;
            white-space: nowrap;
        }

        /* =========================================
           КНОПКИ-КАРТОЧКИ (BENTO LINKS)
           ========================================= */
        .links-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .bento-link-card {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 18px;
            border-radius: 24px;
            text-decoration: none;
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-glass);
            box-shadow: 0 14px 30px -10px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.22s ease, background 0.22s ease, box-shadow 0.22s ease;
        }

        .bento-link-card:nth-child(1) { animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s backwards; }
        .bento-link-card:nth-child(2) { animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.3s backwards; }
        .bento-link-card:nth-child(3) { animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.4s backwards; }

        /* Интерактивное свечение за курсором мыши */
        .bento-link-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(300px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255, 15, 66, 0.16), transparent 60%);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .bento-link-card:hover::before {
            opacity: 1;
        }

        /* Акцентная карточка №1: НАШ БОТ */
        .bento-link-card.hero-bot-card {
            background: linear-gradient(135deg, rgba(255, 15, 66, 0.22) 0%, rgba(22, 24, 34, 0.92) 65%);
            border: 1px solid rgba(255, 46, 91, 0.45);
            box-shadow: 
                0 18px 40px -10px rgba(255, 15, 66, 0.32),
                inset 0 1px 1px rgba(255, 255, 255, 0.25);
        }

        /* Автоматический световой блик на главной кнопке бота */
        .hero-bot-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: -120%;
            width: 55%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.18), transparent);
            transform: skewX(-25deg);
            animation: sheenSweep 4.5s infinite;
            pointer-events: none;
        }

        .bento-link-card:hover {
            transform: translateY(-3px);
            background: var(--bg-card-hover);
            border-color: rgba(255, 255, 255, 0.22);
        }

        .bento-link-card.hero-bot-card:hover {
            border-color: rgba(255, 46, 91, 0.8);
            box-shadow: 0 22px 45px -8px rgba(255, 15, 66, 0.45);
        }

        .bento-link-card:active {
            transform: scale(0.98);
        }

        .link-left {
            display: flex;
            align-items: center;
            gap: 14px;
            position: relative;
            z-index: 2;
        }

        /* Иконка внутри кнопки */
        .link-icon-box {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform 0.25s ease, background 0.25s ease;
        }

        .hero-bot-card .link-icon-box {
            background: linear-gradient(135deg, #FF1A4B 0%, #C4002B 100%);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 20px -4px rgba(255, 15, 66, 0.6);
        }

        .link-icon-box svg {
            width: 22px;
            height: 22px;
            stroke: var(--brand-bright);
            stroke-width: 2.1;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .hero-bot-card .link-icon-box svg {
            stroke: #FFFFFF;
        }

        .hero-bot-card .link-icon-box svg circle {
            fill: #FFFFFF;
        }

        .link-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .link-title-line {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .link-title {
            font-family: 'Unbounded', sans-serif;
            font-size: 14px;
            font-weight: 800;
            color: #FFFFFF;
            letter-spacing: 0.01em;
        }

        .link-handle {
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-muted);
        }

        /* Правая часть карточки (Кнопка/Стрелка) */
        .link-action {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
        }

        .cta-pill {
            background: #FFFFFF;
            color: #06070B;
            font-size: 12px;
            font-weight: 800;
            padding: 8px 14px;
            border-radius: 100px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.25);
            transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease;
        }

        .hero-bot-card:hover .cta-pill {
            background: var(--brand-bright);
            color: #FFFFFF;
            transform: scale(1.04);
        }

        .arrow-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }

        .arrow-circle svg {
            stroke: #FFFFFF;
            stroke-width: 2.4;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.2s ease;
        }

        .bento-link-card:hover .arrow-circle {
            background: var(--brand);
            border-color: var(--brand-bright);
            transform: scale(1.06);
        }

        .bento-link-card:hover .arrow-circle svg {
            transform: translateX(2px);
        }

        /* Анимации */
        @keyframes phoneFloatIn {
            0% { opacity: 0; transform: translateY(40px) scale(0.94); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes radarPulse {
            0% { transform: translateX(-50%) scale(0.85); opacity: 0.7; }
            100% { transform: translateX(-50%) scale(1.35); opacity: 0; }
        }

        @keyframes spinSlow {
            from { transform: translateX(-50%) rotate(0deg); }
            to { transform: translateX(-50%) rotate(360deg); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        @keyframes sheenSweep {
            0% { left: -120%; }
            35%, 100% { left: 160%; }
        }

        @keyframes desktopPhoneLevitate {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-14px); }
        }

        /* =========================================================
           ВЕРСИЯ ДЛЯ ПК И НОУТБУКОВ (Широкоформатный Bento-лендинг)
           ========================================================= */
        @media (min-width: 900px) {
            body {
                padding: 40px 60px;
            }

            .bento-stage {
                max-width: 1020px;
                display: grid;
                grid-template-columns: 1.08fr 0.92fr;
                gap: 64px;
                align-items: center;
            }

            /* На ПК слева управление, справа — парящий смартфон с радаром */
            .bento-content {
                order: 1;
                gap: 16px;
            }

            .phone-portal {
                order: 2;
                height: auto;
                margin-bottom: 0;
                align-items: center;
            }

            .radar-ring {
                top: 50%;
                transform: translate(-50%, -50%);
            }

            @keyframes radarPulseDesktop {
                0% { transform: translate(-50%, -50%) scale(0.85); opacity: 0.7; }
                100% { transform: translate(-50%, -50%) scale(1.4); opacity: 0; }
            }

            @keyframes spinSlowDesktop {
                from { transform: translate(-50%, -50%) rotate(0deg); }
                to { transform: translate(-50%, -50%) rotate(360deg); }
            }

            .radar-ring-1 {
                width: 340px;
                height: 340px;
                animation: radarPulseDesktop 4s ease-out infinite;
            }

            .radar-ring-2 {
                width: 440px;
                height: 440px;
                animation: spinSlowDesktop 30s linear infinite;
            }

            .phone-frame {
                width: 380px;
                max-width: 100%;
                mask-image: linear-gradient(to top, transparent 0%, black 22%, black 100%);
                -webkit-mask-image: linear-gradient(to top, transparent 0%, black 22%, black 100%);
                animation: desktopPhoneLevitate 6s ease-in-out infinite;
            }

            .brand-bento-card {
                padding: 28px 28px 24px;
                border-radius: 32px;
            }

            .logo-vault {
                width: 62px;
                height: 62px;
                border-radius: 18px;
            }

            .logo-vault img {
                width: 34px;
                height: 34px;
            }

            .brand-title {
                font-size: 30px;
            }

            .brand-description {
                font-size: 15.5px;
                margin-bottom: 20px;
            }

            .chip {
                padding: 10px 10px;
                flex-direction: row;
                gap: 7px;
            }

            .chip span {
                font-size: 12px;
            }

            .links-stack {
                gap: 12px;
            }

            .bento-link-card {
                padding: 18px 22px;
                border-radius: 26px;
            }

            .link-title {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- Атмосферный кибер-фон -->
    <div class="cyber-grid" aria-hidden="true"></div>
    <div class="glow-top" aria-hidden="true"></div>
    <div class="glow-bottom" aria-hidden="true"></div>

                <!-- Преимущества -->
                <div class="feature-chips">

                            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                        </svg>
                        <span>В 1 клик</span>
                    </div>
                    <div class="chip">
                        <svg viewBox="0 0 24 24">
                            <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>

                        <span>Без потерь</span>
                    </div>
                </div>
            </header>

            <!-- Стек ссылок -->
            <div class="links-stack">
                
                <!-- 1. НАШ БОТ -->

    <script>
        document.querySelectorAll('.bento-link-card').forEach(card => {
            card.addEventListener('mousemove', e => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                card.style.setProperty('--mouse-x', `${x}px`);
                card.style.setProperty('--mouse-y', `${y}px`);
            });
        });
