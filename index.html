<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALPAN VPN — Лучший впн в Дагестане</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand: #FF073A;
            --brand-glow: rgba(255, 7, 58, 0.42);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #F8F9FD;
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 56px 24px;
            position: relative;
            overflow-x: hidden;
        }

        /* Направляющие вертикальные линии сетки */
        .grid-lines {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 440px;
            height: 100%;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 1;
            padding: 0 24px;
        }

        .grid-line {
            width: 1px;
            height: 100%;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.03) 0%, rgba(255, 7, 58, 0.12) 100%);
        }

        /* Нижний фоновый градиент */
        .bottom-mesh {
            position: fixed;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 140%;
            max-width: 720px;
            height: 60vh;
            background: radial-gradient(ellipse 85% 60% at 50% 100%, rgba(255, 59, 92, 0.32) 0%, rgba(255, 120, 145, 0.14) 55%, transparent 100%);
            pointer-events: none;
            z-index: 1;
            filter: blur(55px);
        }

        /* Центровочный контейнер сцены */
        .stage-wrapper {
            width: 100%;
            max-width: 348px;
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Мокап смартфона: смещен глубже по оси Y + градиентная маска затухания снизу */
        .phone-mockup-frame {
            position: absolute;
            top: -24px;
            left: 50%;
            transform: translateX(-50%);
            width: 342px;
            max-width: 92vw;
            pointer-events: none;
            z-index: 1;
            display: flex;
            justify-content: center;
            opacity: 0.95;
            
            mask-image: linear-gradient(to top, transparent 0%, black 40%, black 100%);
            -webkit-mask-image: linear-gradient(to top, transparent 0%, black 40%, black 100%);

            animation: phoneDropIn 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            will-change: transform, opacity;
        }

        .phone-mockup-frame img {
            width: 100%;
            height: auto;
            display: block;
            filter: drop-shadow(0 20px 40px rgba(255, 7, 58, 0.18)) drop-shadow(0 8px 16px rgba(0, 0, 0, 0.06));
        }

        @keyframes phoneDropIn {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(60px) scale(0.96);
            }
            100% {
                opacity: 0.95;
                transform: translateX(-50%) translateY(0) scale(1);
            }
        }

        /* Слой компонентов интерфейса */
        .ui-overlay {
            width: 100%;
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 236px;
        }

        /* Шапка: приведена к единому стилю Liquid Glass */
        .header-card {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 14px 18px;
            border-radius: 28px;
            margin-bottom: 12px;

            background: linear-gradient(135deg, 
                rgba(255, 255, 255, 0.84) 0%, 
                rgba(255, 255, 255, 0.52) 50%, 
                rgba(255, 255, 255, 0.70) 100%
            );
            backdrop-filter: blur(32px) saturate(200%);
            -webkit-backdrop-filter: blur(32px) saturate(200%);

            border: 1.5px solid rgba(255, 255, 255, 0.85);
            border-top: 1.8px solid rgba(255, 255, 255, 0.98);
            border-bottom: 1.2px solid rgba(255, 255, 255, 0.45);

            box-shadow: 
                0 18px 36px -10px rgba(255, 80, 110, 0.18),
                0 10px 20px -6px rgba(0, 0, 0, 0.04),
                inset 0 1.8px 2.5px 0 rgba(255, 255, 255, 1),
                inset 0 -1.5px 2.5px 0 rgba(255, 200, 215, 0.3);
        }

        .logo-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 3px;
        }

        /* Apple Squircle иконка логотипа */
        .apple-app-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: linear-gradient(145deg, #FF1744 0%, #D50028 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 1.2px solid rgba(255, 255, 255, 0.5);
            box-shadow: 
                0 10px 20px -3px rgba(229, 9, 48, 0.52),
                0 3px 8px -2px rgba(229, 9, 48, 0.32),
                inset 0 1.2px 1.8px 0 rgba(255, 255, 255, 0.7),
                inset 0 -1.2px 1.8px 0 rgba(0, 0, 0, 0.2);
        }

        .brand-logo-img {
            width: 22px;
            height: 22px;
            object-fit: contain;
            display: block;
        }

        .title {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            background: linear-gradient(180deg, #FF1E46 0%, #E6002E 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 10px rgba(255, 7, 58, 0.25));
        }

        .subtitle {
            font-size: 13px;
            font-weight: 700;
            color: #1A212D;
            letter-spacing: -0.01em;
        }

        /* Группа кнопок (scale ~90%) */
        .buttons-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Карточка Liquid Glass */
        .liquid-glass-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            border-radius: 30px;
            text-decoration: none;
            position: relative;
            overflow: hidden;

            background: linear-gradient(135deg, 
                rgba(255, 255, 255, 0.84) 0%, 
                rgba(255, 255, 255, 0.50) 50%, 
                rgba(255, 255, 255, 0.68) 100%
            );
            backdrop-filter: blur(32px) saturate(200%);
            -webkit-backdrop-filter: blur(32px) saturate(200%);

            border: 1.5px solid rgba(255, 255, 255, 0.85);
            border-top: 1.8px solid rgba(255, 255, 255, 0.98);
            border-bottom: 1.2px solid rgba(255, 255, 255, 0.45);

            box-shadow: 
                0 20px 38px -10px rgba(255, 90, 120, 0.18),
                0 12px 22px -6px rgba(0, 0, 0, 0.05),
                inset 0 1.8px 2.5px 0 rgba(255, 255, 255, 1),
                inset 0 -1.8px 2.5px 0 rgba(255, 200, 215, 0.32);

            transition: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.18s ease;
        }

        .liquid-glass-card:active {
            transform: scale(0.975);
            box-shadow: 
                0 10px 18px -4px rgba(255, 90, 120, 0.14),
                0 6px 12px -3px rgba(0, 0, 0, 0.04),
                inset 0 1.2px 1.8px 0 rgba(255, 255, 255, 0.95);
        }

        .card-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        /* Линза иконки */
        .icon-lens {
            width: 42px;
            height: 42px;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 235, 240, 0.75) 100%);
            border-radius: 17px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 
                0 6px 15px -3px rgba(255, 7, 58, 0.16),
                inset 0 1.2px 1.2px #ffffff,
                inset 0 -1px 1.5px rgba(255, 7, 58, 0.08);
        }

        .icon-lens svg {
            width: 20px;
            height: 20px;
            stroke: var(--brand);
            fill: none;
            stroke-width: 2.3;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .card-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .card-title {
            font-size: 14.5px;
            font-weight: 900;
            letter-spacing: -0.01em;
            text-transform: uppercase;
            color: #0A0D14;
        }

        .card-sub {
            font-size: 12px;
            font-weight: 600;
            color: #4B5565;
            letter-spacing: -0.01em;
        }

        .chevron {
            stroke: #E11D48;
            stroke-width: 2.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            opacity: 0.8;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        .liquid-glass-card:hover .chevron,
        .liquid-glass-card:active .chevron {
            opacity: 1;
            transform: translateX(3px);
        }
    </style>
</head>
<body>

    <!-- Направляющие линии сетки -->
    <div class="grid-lines">
        <div class="grid-line"></div>
        <div class="grid-line"></div>
        <div class="grid-line"></div>
        <div class="grid-line"></div>
    </div>

    <!-- Мягкий розово-красный градиент фона -->
    <div class="bottom-mesh"></div>

    <div class="stage-wrapper">
        <!-- Полноразмерный мокап смартфона с маской градиентного затухания -->
        <div class="phone-mockup-frame" aria-hidden="true">
            <img src="logo2.png" alt="Phone Shell">
        </div>

        <!-- Интерфейсный слой Liquid Glass поверх экрана -->
        <main class="ui-overlay">
            <!-- Плашка ALPAN VPN в едином Liquid Glass стиле -->
            <header class="header-card">
                <div class="logo-wrap">
                    <div class="apple-app-icon">
                        <img src="logo.png" alt="ALPAN" class="brand-logo-img">
                    </div>
                    <h1 class="title">ALPAN VPN</h1>
                </div>
                <p class="subtitle">Лучший впн в Дагестане.</p>
            </header>

            <!-- Кнопки Liquid Glass -->
            <div class="buttons-group">
                <!-- 1. НАШ БОТ -->
                <a href="https://t.me/AlpanVPNrobot?start=alpan" target="_blank" rel="noopener" class="liquid-glass-card">
                    <div class="card-left">
                        <div class="icon-lens">
                            <svg viewBox="0 0 24 24">
                                <rect x="3" y="11" width="18" height="10" rx="4"></rect>
                                <circle cx="9" cy="16" r="1.5" fill="var(--brand)"></circle>
                                <circle cx="15" cy="16" r="1.5" fill="var(--brand)"></circle>
                                <path d="M12 7v4"></path>
                                <line x1="8" y1="2" x2="8" y2="4"></line>
                                <line x1="16" y1="2" x2="16" y2="4"></line>
                            </svg>
                        </div>
                        <div class="card-text">
                            <span class="card-title">НАШ БОТ</span>
                            <span class="card-sub">t.me/AlpanVPNrobot</span>
                        </div>
                    </div>
                    <svg class="chevron" width="16" height="16" viewBox="0 0 24 24">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </a>

                <!-- 2. НАШ КАНАЛ -->
                <a href="https://t.me/alpanvpn" target="_blank" rel="noopener" class="liquid-glass-card">
                    <div class="card-left">
                        <div class="icon-lens">
                            <svg viewBox="0 0 24 24">
                                <line x1="22" y1="2" x2="11" y2="13"></line>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                            </svg>
                        </div>
                        <div class="card-text">
                            <span class="card-title">НАШ КАНАЛ</span>
                            <span class="card-sub">t.me/alpanvpn</span>
                        </div>
                    </div>
                    <svg class="chevron" width="16" height="16" viewBox="0 0 24 24">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </a>

                <!-- 3. ПОДДЕРЖКА -->
                <a href="https://t.me/AlpanSupport" target="_blank" rel="noopener" class="liquid-glass-card">
                    <div class="card-left">
                        <div class="icon-lens">
                            <svg viewBox="0 0 24 24">
                                <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
                                <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
                            </svg>
                        </div>
                        <div class="card-text">
                            <span class="card-title">ПОДДЕРЖКА</span>
                            <span class="card-sub">t.me/AlpanSupport</span>
                        </div>
                    </div>
                    <svg class="chevron" width="16" height="16" viewBox="0 0 24 24">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </a>
            </div>
        </main>
    </div>

</body>
</html>
